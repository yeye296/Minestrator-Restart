name: Delete old workflow runs

on:
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行
  schedule:
    - cron: '15 0 1 * *' # 每月 1 号 00:10 运行一次

permissions:
  actions: write
  contents: write
  
jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      # 第一步：拉取仓库代码（关键修复步骤）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：删除旧的 workflow 运行记录
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0         # 不按天数保留
          keep_minimum_runs: 7   # 保留最近的 7 次记录

      # 第三步：更新保活时间戳并提交
      - name: Update keep-alive timestamp
        run: |
          date '+%Y-%m-%d %H:%M:%S' > .keepalive
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m "chore: keep repo active [skip ci]" || echo "No changes to commit"
          git push
